# Generated by AF2-CatGraph GUI. This is a standard AF2-CatGraph config.
# Keep this file with your results to make the run reproducible.

config_schema: public_01_09
project:
  target_id: PTP1B
  output_root: results/PTP1B
inputs:
  af2_dir: /home/wms/AF2-test/AF2-CatGraph/data/PTP1B/01_af2_new/
  template_protein_pdb: /home/wms/AF2-test/AF2-CatGraph/data/PTP1B/02_templates/template.pdb
  ligand_pdb: /home/wms/AF2-test/AF2-CatGraph/data/PTP1B/02_templates/ligand.pdb
step01:
  global_plddt_min: 80.0
  plddt_atom: CA
  plddt_filter_scope: source_if_available
  af2_preprocess_manifest: auto
step02:
  input_source: step01
  output_naming: short_pdb_rank
  overwrite: true
  multi_ligand_mode: sequential
  alignment_mode: auto
  general_alignment:
    min_sequence_identity: 0.7
    min_alignment_coverage: 0.7
    min_matched_ca: 30
step03:
  ligand_selection:
    include_hetatm: true
    include_resnames: null
    exclude_resnames:
    - HOH
    - WAT
  clash:
    method: standard
    neighbor_search_cutoff: 5.0
    clash_max: 10
    delta: 0.5
step04:
  catalytic_region:
    ligand_resnames: &id001
    - LIG
    distance_cutoff: 6.0
    mean_plddt_min: 90.0
    quantile10_plddt_min: 80.0
step05:
  plip_executable: plip
  run_plip: true
  clean_output: true
  save_intermediate_files: true
  ligand_selection:
    include_resnames: *id001
    exclude_resnames:
    - HOH
    - WAT
    inventory_source: input
  node_identity:
    ligand_node_id: residue_aware
    ligand_ged_label: auto
  connectivity:
    source: input_conect_then_rdkit_same_residue
    allow_cross_residue_rdkit_connectivity: false
step06:
  conservation_file: /home/wms/AF2-test/AF2-CatGraph/data/PTP1B/07_conservation/6B90.zip
  conservation:
    mapping:
      enabled: true
      min_target_coverage: 0.9
      min_contact_coverage: 0.9
      fail_on_low_target_coverage: true
      fail_on_low_contact_coverage: true
  ligand:
    include_resnames: *id001
    exclude_resnames:
    - HOH
    - WAT
  distance:
    residue_ligand_distance_max: 3.0
    use_heavy_atoms_only: true
    protein_atom_scope: all
  thresholds:
    consurf_grade_min: 8
    residue_ligand_distance_max: 3.0
    occurrence_frequency_min: 0.8
    require_graph_occurrence: true
  structure_filter:
    enabled: true
    require_key_residues: all
    contact_definition: graph
  node_grouping:
    enabled: true
    contact_definition: graph
    required_residue_source: auto
    display_format: one_letter_number
    type_order: residue_count_desc
    residue_order: sequence
step07:
  use_step07_filter: true
  ged:
    executable: /home/wms/AF2-test/AF2-CatGraph/external/Graph_Edit_Distance/ged
    threshold: 1.0
    max_workers: 2
    timeout_seconds: 300
    require_same_edge_count: true
step08:
  enabled: true
  split_nonidentical_classes: true
  class_signature_policy: most_common
  thresholds:
    common_frequency_min: 0.8
    rare_frequency_max: 0.1
  canonicalization:
    contact_unit_mode: universal_rules
    equivalence_mode: standard
    use_builtin_ligand_units: false
    manual_ligand_units: {}
    recommendations:
      enabled: true
      require_acceptance: false
      consensus_min_fraction: 0.8
      ligand_smiles: {}
      accepted_recommendation_ids: []
      rejected_recommendation_ids: []
    interaction_type_map: {}
    auto_detect_ligand_units: true
  export_candidates:
    enabled: true
    mode: copy
step09:
  plot:
    formats:
    - svg
    - png
    fig_width: null
    fig_height: null
    dpi: 300
    grid_cols: 3
  layout:
    entity_order: *id001
    connectivity_source: standard
    entity_spacing: 6.2
    entity_y_offsets: []
    substrate_scale: 2.75
    rotate: 0.0
    rotate_substrates: {}
    swap_substrates: false
    residue_base_distance: 14.0
    residue_core_min_distance: 7.0
    residue_residue_min_distance: 8.6
    layout_zoom: 1.0
    manual_residue_offsets: {}
    manual_node_offsets: {}
  style:
    node_size: 450
    font_size: 6.5
    ligand_node_scale: 0.3
  export_candidates:
    enabled: true
    mode: copy
step10_optional:
  enabled: false
  timing: before_docking
  output_subdir: 10_optional_ligand_atom_trimming
  atom_selection:
    default_action: keep
    drop_conect_records: false
    renumber_atoms: true
    fail_on_empty_keep_only: true
    exclude_resnames:
    - HOH
    - WAT
    rules: []
execution:
  conda_executable: conda
  colabfold_conda_env: ''
  workflow_conda_env: ''
