name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax-and-package:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python sources
        run: python -m compileall -q catcongraph scripts tests
      - name: Build distributions
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Verify offline viewer assets are packaged
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path
          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {
              "catcongraph/static/3Dmol-min.js",
              "catcongraph/static/3Dmol-min.js.LICENSE.txt",
              "catcongraph/static/3Dmol-LICENSE",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"Missing package data: {missing}")
          PY

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install test environment
        # PLIP and OpenBabel are verified by the Linux installer. Unit tests do
        # not require their external executables or Conda-only bindings.
        run: python -m pip install -e ".[gui,test]"
      - name: Run tests
        run: pytest -q
